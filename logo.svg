<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="TD monogram logo" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E4C766" />
      <stop offset="100%" stop-color="#C9A227" />
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="#1E2022" />
  <rect x="0.5" y="0.5" width="511" height="511" rx="111.5" fill="none" stroke="#33363A" />

  <!-- Monogram: T and D built from two simple strokes, echoing an
       editorial nameplate rather than a literal letterform icon -->
  <g fill="none" stroke="url(#gold)" stroke-width="22" stroke-linecap="round">
    <path d="M156 176h124" />
    <path d="M218 176v160" />
    <path d="M298 176h48c46 0 80 36 80 80s-34 80-80 80h-48V176z" />
  </g>

  <!-- accent spark: signals "automation / generated" without
       reaching for a literal robot or spark-cliché icon -->
  <circle cx="392" cy="140" r="10" fill="#3FA796" />
</svg>
